services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: slotiva
      POSTGRES_USER: slotiva
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - slotiva-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U slotiva -d slotiva]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://slotiva:${POSTGRES_PASSWORD}@db:5432/slotiva
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:?Generate ADMIN_PASSWORD_HASH as described in README}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173}
    ports:
      - 127.0.0.1:8000:8000
    depends_on:
      db:
        condition: service_healthy
volumes:
  slotiva-data:
