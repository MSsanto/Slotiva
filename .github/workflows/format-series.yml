name: Format series branch
on:
  push:
    branches: [feat/series-editing]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/series-editing
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write src worker worker-tests e2e
      - name: Commit formatting when needed
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src worker worker-tests e2e
            git commit -m "style: format recurring agreement changes"
            git push origin HEAD:feat/series-editing
          fi
