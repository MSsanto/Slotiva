name: Slotiva CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm test
      - run: npm run test:worker
      - run: npm run build
      - run: npx wrangler deploy --dry-run --outdir .wrangler/dry-run
      - run: npx playwright install --with-deps chromium
      - name: Initialize isolated local D1 and run browser tests
        run: |
          node scripts/test-env.mjs
          npm run db:local
          npm run dev:api -- --ip 127.0.0.1 --var COOKIE_SECURE:false > /tmp/slotiva-api.log 2>&1 &
          for attempt in $(seq 1 30); do curl -fsS http://127.0.0.1:8787/api/health && break || sleep 1; done
          npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: |
            test-results/
            /tmp/slotiva-api.log
